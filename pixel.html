<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes — AI Agents Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1f; --bg2:#0d1430; --panel:#111a3d; --panel2:#0c1430;
    --ink:#cfe3ff; --dim:#5f6ea8; --line:#21306b;
    --cyan:#27e0ff; --green:#39ff9e; --amber:#ffcf४d; --amber:#ffcf4d; --magenta:#ff5cf0; --red:#ff4d6d; --gold:#ffd76a;
    --shadow:0 0 0 2px #060a18, 4px 4px 0 0 #060a18;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1100px 600px at 80% -10%, #14225e55, transparent),
      radial-gradient(900px 500px at 0% 110%, #2a124d55, transparent),
      var(--bg);
    color:var(--ink); font-family:'VT323',monospace; font-size:20px;
    image-rendering:pixelated; letter-spacing:.5px;
    background-attachment:fixed;
  }
  /* pixel grid + scanlines */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
    background-size:32px 32px;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,#0000 0 2px,#0000000d 2px 4px);mix-blend-mode:multiply}
  .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:22px 20px 60px}
  h1,h2,h3,.px{font-family:'Press Start 2P',monospace}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    border:2px solid var(--line);background:linear-gradient(180deg,#10193f,#0b1330);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
  h1{font-size:22px;margin:0;color:#fff;text-shadow:3px 3px 0 var(--magenta),6px 6px 0 #00000080;line-height:1.4}
  h1 .sub{display:block;font-family:'VT323';font-size:18px;color:var(--cyan);text-shadow:none;letter-spacing:2px;margin-top:8px}
  .status{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--dim);font-family:'Press Start 2P'}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
  .dot.on{background:var(--green);box-shadow:0 0 12px var(--green);animation:blink 1.6s steps(2) infinite}
  @keyframes blink{50%{opacity:.45}}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{border:2px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:var(--shadow);padding:14px}
  .card h2{font-size:12px;margin:0 0 12px;color:var(--gold);text-shadow:2px 2px 0 #00000080;display:flex;gap:8px;align-items:center}
  .card h2 small{font-family:'VT323';font-size:16px;color:var(--dim);margin-left:auto;letter-spacing:1px}
  /* agent desks */
  .agents{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  @media(max-width:700px){.agents{grid-template-columns:1fr}}
  .agent{position:relative;border:2px solid var(--line);background:linear-gradient(180deg,#13205a,#0b1330);box-shadow:var(--shadow);padding:16px;overflow:hidden}
  .agent .role{font-family:'Press Start 2P';font-size:13px;color:#fff;text-shadow:2px 2px 0 #00000090}
  .agent .sprite{font-size:40px;line-height:1;filter:drop-shadow(3px 3px 0 #00000070)}
  .agent .top{display:flex;align-items:center;gap:14px}
  .agent .meta{margin-left:auto;text-align:right;font-size:16px;color:var(--dim)}
  .pill{display:inline-block;font-family:'Press Start 2P';font-size:9px;padding:5px 8px;border:2px solid;margin-top:8px}
  .pill.work{color:#04121a;background:var(--green);border-color:#0a3b27;animation:pulse 1.2s infinite}
  .pill.idle{color:var(--dim);background:#0b1330;border-color:var(--line)}
  .pill.off{color:#2a0c12;background:var(--red);border-color:#5e0d1f}
  @keyframes pulse{50%{box-shadow:0 0 14px var(--green)}}
  .agent .doing{margin-top:12px;font-size:18px;color:var(--cyan);min-height:24px}
  .agent .tags{margin-top:8px;font-size:15px;color:var(--dim)}
  .agent .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:#0a1130}
  .agent .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green))}
  .agent.working .bar i{animation:load 2.4s ease-in-out infinite}
  @keyframes load{0%{width:6%}50%{width:92%}100%{width:6%}}
  /* kanban */
  .lanes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  @media(max-width:900px){.lanes{grid-template-columns:repeat(3,1fr)}}
  .lane{border:2px solid var(--line);background:#0b1330;min-height:120px;padding:8px}
  .lane .lh{font-family:'Press Start 2P';font-size:9px;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:8px}
  .lane.running .lh{color:var(--green)} .lane.blocked .lh{color:var(--red)} .lane.done .lh{color:var(--cyan)}
  .tk{border:2px solid var(--line);background:linear-gradient(180deg,#142158,#0d1636);padding:7px;margin-bottom:7px;font-size:15px;color:var(--ink);box-shadow:2px 2px 0 #00000060}
  .tk b{display:block;font-size:13px;color:var(--gold);font-family:'VT323'}
  .empty{color:var(--dim);font-size:15px;text-align:center;padding:18px 4px}
  .list .row{display:flex;gap:10px;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:17px}
  .list .row:last-child{border-bottom:0}
  .k{color:var(--dim)} .v{margin-left:auto;color:var(--ink);text-align:right}
  .foot{margin-top:18px;text-align:center;color:var(--dim);font-size:15px}
  .err{border:2px solid var(--red);background:#22000d;color:#ffd6de;padding:14px;margin-bottom:16px;font-size:17px}
  a{color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HERMES&nbsp;AI&nbsp;AGENTS<span class="sub">// LIVE OPERATIONS FLOOR</span></h1>
    <div class="status"><span id="dot" class="dot"></span><span id="statustxt">CONNECTING…</span></div>
  </header>

  <div id="err" class="err" style="display:none"></div>

  <div class="agents" id="agents"></div>

  <div class="grid">
    <div class="card" style="grid-column:1 / -1">
      <h2>🗂️ WORK PIPELINE — KANBAN <small id="kanbanmeta"></small></h2>
      <div class="lanes" id="lanes"></div>
    </div>
    <div class="card">
      <h2>⏰ SCHEDULED JOBS</h2>
      <div class="list" id="crons"><div class="empty">none yet</div></div>
    </div>
    <div class="card">
      <h2>📁 PROJECTS / CLIENTS</h2>
      <div class="list" id="spaces"></div>
    </div>
    <div class="card">
      <h2>🛰️ SYSTEM</h2>
      <div class="list" id="sys"></div>
    </div>
  </div>

  <div class="foot">Hermes live floor · refreshes every 5s · <span id="ts"></span></div>
</div>

<script>
const SPRITES = { marketer:"📈", developer:"💻", default:"🤖" };
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function j(p){ const r=await fetch(p,{credentials:"include"}); if(!r.ok) throw new Error(p+" "+r.status); return r.json(); }

function agentCard(p, activeProfile, sessionsForActive){
  const online = p.gateway_running;
  const isActive = p.name===activeProfile;
  const working = isActive && sessionsForActive>0;
  const sprite = SPRITES[p.name] || "🧠";
  const role = p.name==="marketer"?"MARKETER":p.name==="developer"?"DEVELOPER":p.name.toUpperCase();
  const cls = online ? (working?"work":"idle") : "off";
  const label = online ? (working?"WORKING":"ONLINE") : "OFFLINE";
  const doing = working ? (sessionsForActive+" live session"+(sessionsForActive>1?"s":"")+" · on the job")
                        : (online? "idle — gateway ticking, waiting for work" : "gateway down");
  return `<div class="agent ${working?'working':''}">
    <div class="top">
      <div class="sprite">${sprite}</div>
      <div><div class="role">${esc(role)}</div>
        <div class="pill ${cls}">${label}</div></div>
      <div class="meta">model<br><b style="color:var(--ink)">${esc(p.model||"minimax/minimax-m3")}</b></div>
    </div>
    <div class="doing">▸ ${esc(doing)}</div>
    <div class="tags">skills: ${p.total_skills||p.skill_count||"—"} · ${isActive?"<b style='color:var(--green)'>active profile</b>":"standby"}</div>
    <div class="bar"><i></i></div>
  </div>`;
}

async function tick(){
  try{
    const [prof, health, kb, sess, crons, ws] = await Promise.all([
      j("/api/profiles"), j("/api/health/agent"), j("/api/kanban/board"),
      j("/api/sessions"), j("/api/crons"), j("/api/workspaces")
    ]);
    $("#err").style.display="none";
    const gw = health?.details?.gateway_state==="running";
    $("#dot").className = "dot"+(gw?" on":"");
    $("#statustxt").textContent = gw ? "GATEWAY LIVE" : "GATEWAY DOWN";

    const active = sess.active_profile;
    const liveSessions = (sess.sessions||[]).length;
    const profiles = (prof.profiles||[]).sort((a,b)=>(a.name==="default")-(b.name==="default"));
    $("#agents").innerHTML = profiles.map(p=>agentCard(p, active, liveSessions)).join("");

    const cols = kb.columns||[];
    const total = cols.reduce((n,c)=>n+(c.tasks||[]).length,0);
    $("#kanbanmeta").textContent = total+" task"+(total!==1?"s":"");
    $("#lanes").innerHTML = cols.map(c=>{
      const tasks=(c.tasks||[]);
      const cards = tasks.length? tasks.slice(0,6).map(t=>`<div class="tk"><b>${esc(t.assignee||t.tenant||"")}</b>${esc(t.title||t.id||"task")}</div>`).join("")
                                : `<div class="empty">—</div>`;
      return `<div class="lane ${esc(c.name)}"><div class="lh"><span>${esc(c.name)}</span><span>${tasks.length}</span></div>${cards}</div>`;
    }).join("");

    const jobs = crons.jobs||[];
    $("#crons").innerHTML = jobs.length? jobs.map(jb=>`<div class="row"><span class="k">${esc(jb.schedule||jb.cron||"")}</span><span class="v">${esc(jb.name||jb.prompt||jb.id||"job")}</span></div>`).join("")
      : `<div class="empty">no scheduled jobs — ask an agent to create one</div>`;

    const spaces=(ws.workspaces||[]);
    $("#spaces").innerHTML = spaces.map(s=>`<div class="row"><span class="k">▸</span><span class="v">${esc(s.name)} <span style="color:var(--dim)">${esc(s.path)}</span></span></div>`).join("");

    $("#sys").innerHTML = [
      ["profiles", profiles.length],
      ["active", active],
      ["agents running", health?.details?.active_agents??0],
      ["gateway", gw?"running":"stopped"],
      ["other-profile chats", sess.other_profile_count??0],
    ].map(([k,v])=>`<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("");

    $("#ts").textContent = new Date().toLocaleTimeString();
  }catch(e){
    $("#dot").className="dot";
    $("#statustxt").textContent="DISCONNECTED";
    $("#err").style.display="block";
    $("#err").innerHTML = "⚠ Can't read live data ("+esc(e.message)+"). Open <a href='/'>Hermes</a> and log in first, then reload this page.";
  }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
