<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="tab-theme.js"></script><link rel="stylesheet" href="tab-theme.css">
<title>What's New — Hermes</title>
<style>
  :root{--bg:#0a0e18;--panel:#0e1322;--line:#20283f;--line2:#2a3350;--dim:#8a98b8;--ink:#dfe9ff;--accent:#7c8cff;--lime:#b8ff5b}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:22px 18px 60px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  h1{font-size:20px;margin:0} .sub{color:var(--dim);font-size:13px;margin:6px 0 18px;line-height:1.55}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin:0 0 11px}
  .card.rel{border-left:3px solid var(--lime)}
  .card h3{margin:0 0 5px;font-size:15px;color:#fff}
  html:not(.dark) .card h3{color:var(--ink)}
  .date{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim)}
  .msg{font-size:13px;line-height:1.5;margin:2px 0}
  .tag{font-size:9px;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:99px;background:#13203a;color:#bcd;margin-left:8px;vertical-align:middle}
  .body{font-size:12.5px;color:var(--dim);white-space:pre-wrap;line-height:1.5;margin-top:7px;max-height:220px;overflow:auto;border-top:1px solid var(--line2);padding-top:7px}
  .lbl{color:var(--dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 9px}
  .empty{color:var(--dim);text-align:center;padding:44px 16px;line-height:1.6}
  a{color:#8aa0ff} button{border:0;border-radius:8px;padding:7px 13px;font-weight:700;font-size:12px;cursor:pointer;background:#13203a;color:#cfe0ff}
  html:not(.dark) button{background:#eef0f6;color:#1a2138}
</style></head><body>
<div class="wrap">
  <div class="top"><h1>🆕 What's New</h1><button onclick="load()" style="margin-left:auto">↻ Refresh</button></div>
  <div class="sub"><b>🛠️ Your fork</b> = the customizations we ship to your Hermes. <b>⬆️ Upstream</b> = the original <a href="https://github.com/nesquena/hermes-webui" target="_blank">nesquena/hermes-webui</a> that your <b>daily 03:00 MYT sync</b> pulls in (Releases = curated "what's new + why"; commits = every change). So you can see both what you built AND what each update brings.</div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const UPSTREAM="nesquena/hermes-webui";   // the original project your sync pulls from
const FORK="aqilrvsb/hermes-webui";       // your fork (your customizations + the synced commits)
function ago(d){const s=(Date.now()-new Date(d).getTime())/1000;const D=Math.floor(s/86400);if(D>=1)return D+"d ago";const H=Math.floor(s/3600);if(H>=1)return H+"h ago";return Math.max(1,Math.floor(s/60))+"m ago";}
async function gh(repo,p){const r=await fetch("https://api.github.com/repos/"+repo+p,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
function commitCards(commits){return (commits||[]).map(c=>{const msg=((c.commit&&c.commit.message)||"").split("\n")[0];
  const d=c.commit&&c.commit.author&&c.commit.author.date;
  return `<div class="card"><div class="msg">${esc(msg)}</div>
    <div class="date">${d?esc(new Date(d).toLocaleDateString())+" · "+ago(d):""} · ${esc((c.sha||"").slice(0,7))}</div></div>`;}).join("");}
async function load(){
  const el=$("#list"); el.innerHTML='<div class="empty">Loading…</div>';
  try{
    let forkC=[],rels=[],upC=[];
    try{forkC=await gh(FORK,"/commits?per_page=25");}catch(e){}
    try{rels=await gh(UPSTREAM,"/releases?per_page=5");}catch(e){}
    try{upC=await gh(UPSTREAM,"/commits?per_page=30");}catch(e){}
    let html="";
    if(forkC.length){ html+='<div class="lbl">🛠️ Your fork — recent changes (your customizations)</div>'+commitCards(forkC); }
    if(Array.isArray(rels)&&rels.length){
      html+='<div class="lbl">⬆️ Upstream releases (what\'s new + why)</div>';
      html+=rels.map(r=>`<div class="card rel"><h3>${esc(r.name||r.tag_name||"release")}<span class="tag">release</span></h3>
        <div class="date">${r.published_at?esc(new Date(r.published_at).toLocaleDateString()):""}</div>
        ${r.body?`<div class="body">${esc(r.body).slice(0,1400)}</div>`:""}</div>`).join("");
    }
    html+='<div class="lbl">⬆️ Upstream commits (what the daily sync pulls in)</div>'+commitCards(upC);
    el.innerHTML=html||'<div class="empty">No data returned.</div>';
  }catch(e){
    el.innerHTML='<div class="empty">Could not load — '+esc(e.message)+'.<br>(GitHub\'s unauthenticated API allows 60 requests/hour; try Refresh again in a bit.)</div>';
  }
}
load();
</script></body></html>
