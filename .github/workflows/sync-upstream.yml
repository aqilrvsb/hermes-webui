name: Daily sync with upstream

on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC daily (~03:00 MYT)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream + force a daily fresh rebuild
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/nesquena/hermes-webui.git
          git fetch upstream
          UB=$(git remote show upstream | sed -n 's/.*HEAD branch: //p')
          git merge "upstream/${UB}" --no-edit -m "Daily sync: merge upstream ${UB}" || { git merge --abort; echo "merge skipped (diverged/none)"; }
          # Cache-bust so the rebuild re-clones hermes-agent + skills fresh (always latest)
          date -u +"%Y-%m-%dT%H:%M:%SZ" > buildstamp.txt
          git add buildstamp.txt
          git commit -m "Daily refresh $(date -u +%F): re-clone hermes-agent + skills" || echo "nothing to commit"
          git push origin HEAD:master
