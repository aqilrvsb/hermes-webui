<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDFAF4; --card:#FFFFFF; --card2:#F4EFE5; --line:#EAE1D1;
    --text:#221C14; --muted:#6E6454; --green:#F26B21; --red:#ef4444;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:max(16px,env(safe-area-inset-top)) 16px 60px}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 20px;gap:12px}
  h1{font-size:22px;font-weight:700;margin:0}
  header p{color:var(--muted);margin:2px 0 0;font-size:13.5px}
  .btn{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:11px;padding:10px 18px;
    color:#04140a;background:var(--green);white-space:nowrap;transition:filter .15s}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid #46262a}
  .btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
  .grid{display:flex;flex-direction:column;gap:12px}
  .card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;align-items:flex-start}
  .avatar{width:52px;height:64px;flex:0 0 52px;border-radius:12px;background:var(--card2);display:grid;place-items:center;overflow:hidden}
  .avatar img{height:58px;image-rendering:pixelated}
  .cmeta{flex:1;min-width:0}
  .cname{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;text-transform:capitalize}
  .b-facebook{background:#14273f;color:#5ea2ff}.b-instagram{background:#3a1430;color:#ff6ea8}
  .b-tiktok{background:#222;color:#eee}.b-threads{background:#20242a;color:#cfd6dd}
  .sched{color:var(--muted);font-size:13px;margin-top:2px}
  .sched b{color:var(--text);font-weight:600}
  .desc{color:var(--muted);font-size:13.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .empty{border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);text-align:center;padding:42px 20px;font-size:14.5px}
  .overlay{position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;padding:20px}
  .modal h2{margin:0 0 14px;font-size:18px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--card2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--green)}
  textarea{min-height:110px;resize:vertical}
  .icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .icons .ic{border:2px solid var(--line);border-radius:12px;background:var(--card2);padding:6px 0;display:grid;place-items:center;cursor:pointer}
  .icons .ic img{height:52px;image-rendering:pixelated}
  .icons .ic.sel{border-color:var(--green);background:#14251a}
  .time-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .time-row input{flex:1}
  .time-x{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}
  .time-x:hover{color:var(--red);border-color:#46262a}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0e1620;border:1px solid var(--line);
    color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:99}
  .toast.show{opacity:1}
  @media(max-width:560px){.icons{grid-template-columns:repeat(5,1fr)}}
  /* ── premium polish (light + orange) ── */
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  h1{letter-spacing:-.02em;}
  .card{transition:transform .16s ease,box-shadow .2s ease,border-color .2s}
  .card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(34,28,20,.12);border-color:#E0D6C4}
  .btn:not(.ghost):not(.danger){background:linear-gradient(180deg,#F8863F,#F26B21)!important;color:#fff!important;box-shadow:0 3px 12px rgba(242,107,33,.30)}
  .btn:not(.ghost):not(.danger):hover{filter:brightness(1.05);box-shadow:0 5px 16px rgba(242,107,33,.42)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Agents</h1>
      <p>Each agent works one platform and can run several times a day.</p>
    </div>
    <button class="btn" onclick="openModal()">+ New Agent</button>
  </header>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="mtitle">New Agent</h2>
    <label>Agent name</label>
    <input id="f-name" placeholder="e.g. Aina — daily FB posts" maxlength="60">
    <label>Profile icon</label>
    <div class="icons" id="f-icons"></div>
    <label>Platform</label>
    <select id="f-platform"></select>
    <div class="hint" id="plat-hint"></div>
    <label>Model (AI model this agent uses)</label>
    <select id="f-model"></select>
    <label>Timezone</label>
    <select id="f-tz"></select>
    <label>Run daily at — add one or more times</label>
    <div id="f-times"></div>
    <button type="button" class="btn ghost small" onclick="addTime()">+ Add time</button>
    <label>Task description — describe in your own words what this agent should do</label>
    <textarea id="f-desc" placeholder="e.g. Post one motivational tip about small business marketing, in Bahasa Melayu, friendly tone, with 3 hashtags."></textarea>
    <div class="hint">On save, AI rewrites this into a precise task so the agent works reliably. The same task runs at each time you set.</div>
    <div class="mfoot">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="saveBtn" onclick="save()">Save agent</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ICONS=["Claude-1","Me-1","employee-1","employee-2","employee-3","dev-1","dev-2","Frontend-dev-1","explore-1","security-audit-1"];
const PLATFORMS=["facebook","threads","tiktok","instagram"];
const TZS=["Asia/Kuala_Lumpur","Asia/Singapore","Asia/Jakarta","Asia/Bangkok","Asia/Manila","Asia/Hong_Kong","Asia/Tokyo","Asia/Seoul","Asia/Kolkata","Asia/Dubai","Europe/London","Europe/Paris","America/New_York","America/Chicago","America/Los_Angeles","Australia/Sydney","UTC"];
const MODELS=["","openai/gpt-4.1","openai/gpt-4.1-mini","anthropic/claude-sonnet-4.5","openrouter/auto","google/gemini-2.5-pro","google/gemini-2.5-flash","openai/gpt-5.4","deepseek/deepseek-chat"];
const $=s=>document.querySelector(s);
let editing=null, selIcon=ICONS[0], connected={}, times=["09:00"], AGENTS={};
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),3500);}
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const spriteUrl=n=>"/static/office/ch/"+n+"-front-left.png";

function buildStatic(){
  $("#f-tz").innerHTML=TZS.map(z=>`<option value="${z}">${z.replace("_"," ")}</option>`).join("");
  $("#f-model").innerHTML=MODELS.map(m=>`<option value="${m}">${m||"Default (chat model)"}</option>`).join("");
  $("#f-icons").innerHTML=ICONS.map(n=>`<div class="ic${n===selIcon?" sel":""}" data-ic="${n}" onclick="pickIcon('${n}')"><img src="${spriteUrl(n)}" alt="${n}"></div>`).join("");
}
function pickIcon(n){selIcon=n;document.querySelectorAll(".ic").forEach(e=>e.classList.toggle("sel",e.dataset.ic===n));}

function renderTimes(){
  const c=$("#f-times");c.innerHTML="";
  times.forEach((t,i)=>{
    const row=document.createElement("div");row.className="time-row";
    const inp=document.createElement("input");inp.type="time";inp.value=t;
    inp.onchange=()=>{times[i]=inp.value;};
    row.appendChild(inp);
    if(times.length>1){
      const x=document.createElement("button");x.type="button";x.className="time-x";x.textContent="✕";
      x.onclick=()=>{times.splice(i,1);renderTimes();};
      row.appendChild(x);
    }
    c.appendChild(row);
  });
}
function addTime(){times.push("12:00");renderTimes();}

async function loadConnected(){
  try{const r=await fetch("/api/social/status",{credentials:"same-origin"});const d=await r.json();connected=d.connected||{};}
  catch(e){connected={};}
  $("#f-platform").innerHTML=PLATFORMS.map(p=>{
    const on=!!connected[p];
    return `<option value="${p}" ${on?"":"disabled"}>${p[0].toUpperCase()+p.slice(1)}${on?"":" — not connected"}</option>`;
  }).join("");
  $("#plat-hint").textContent=PLATFORMS.some(p=>connected[p])?"":"⚠ No platform connected yet — connect one in the Social Connect tab first.";
}

async function loadAgents(){
  let agents=[];
  try{const r=await fetch("/api/agents/list",{credentials:"same-origin"});const d=await r.json();agents=d.agents||[];}
  catch(e){}
  AGENTS={};agents.forEach(a=>AGENTS[a.agent_id]=a);
  const g=$("#grid");
  if(!agents.length){g.innerHTML=`<div class="empty">No agents yet.<br>Click <b>+ New Agent</b> to create your first one.</div>`;return;}
  g.innerHTML="";
  agents.forEach(a=>{
    const tz=(a.timezone||"").replace("_"," ");
    const tl=(a.times||[]).join(", ")||"—";
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`
      <div class="avatar"><img src="${spriteUrl(a.icon||"Claude-1")}" alt=""></div>
      <div class="cmeta">
        <div class="cname">${esc(a.name)} <span class="badge b-${a.platform}">${a.platform}</span></div>
        <div class="sched">Runs daily at <b>${esc(tl)}</b> (${esc(tz)})</div>
        <div class="sched">Model: <b>${esc(a.model||"default (chat model)")}</b></div>
        <div class="desc">${esc(a.description)}</div>
        <div class="actions">
          <button class="btn ghost small" onclick="openModal('${a.agent_id}')">Edit</button>
          <button class="btn ghost small" onclick="runNow('${a.agent_id}')">Run now</button>
          <button class="btn danger small" onclick="del('${a.agent_id}')">Delete</button>
        </div>
      </div>`;
    g.appendChild(card);
  });
}

function openModal(id){
  const a=id?AGENTS[id]:null;
  editing=a?a.agent_id:null;
  $("#mtitle").textContent=editing?"Edit Agent":"New Agent";
  $("#f-name").value=a?a.name:"";
  selIcon=(a&&a.icon)||ICONS[0];
  $("#f-tz").value=(a&&a.timezone)||"Asia/Kuala_Lumpur";
  times=(a&&a.times&&a.times.length)?a.times.slice():["09:00"];
  $("#f-desc").value=(a&&a.description)||"";
  buildStatic();renderTimes();
  $("#f-model").value=(a&&a.model)||"";
  if(a&&a.platform){
    const opt=[...$("#f-platform").options].find(o=>o.value===a.platform);
    if(opt){opt.disabled=false;$("#f-platform").value=a.platform;}
  }
  $("#overlay").classList.add("show");
}
function closeModal(){$("#overlay").classList.remove("show");}

async function save(){
  const payload={
    agent_id:editing||undefined,
    name:$("#f-name").value.trim(),
    icon:selIcon,
    platform:$("#f-platform").value,
    timezone:$("#f-tz").value,
    times:times.filter(Boolean),
    model:$("#f-model").value,
    description:$("#f-desc").value.trim(),
  };
  if(!payload.name)return toast("Give the agent a name.");
  if(!payload.description)return toast("Describe the task.");
  if(!payload.times.length)return toast("Add at least one run time.");
  const btn=$("#saveBtn");btn.disabled=true;btn.textContent="AI preparing agent…";
  try{
    const r=await fetch("/api/agents/save",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));
    closeModal();toast(editing?"Agent updated.":"Agent created ✅");loadAgents();
  }catch(e){toast("Save failed: "+e.message);}
  btn.disabled=false;btn.textContent="Save agent";
}

async function del(id){
  const a=AGENTS[id];if(!a)return;
  if(!confirm("Delete agent \""+a.name+"\"?"))return;
  try{
    const r=await fetch("/api/agents/delete",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({agent_id:id})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    toast("Agent deleted.");loadAgents();
  }catch(e){toast("Delete failed: "+e.message);}
}

async function runNow(id){
  const a=AGENTS[id];if(!a)return;
  const ids=a.job_ids||[];
  if(!ids.length)return toast("Nothing to run.");
  try{
    for(const jid of ids){
      await fetch("/api/crons/run",{method:"POST",credentials:"same-origin",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:jid})});
    }
    toast("\""+a.name+"\" is running now — check the platform shortly.");
  }catch(e){toast("Run failed: "+e.message);}
}

buildStatic();renderTimes();loadConnected();loadAgents();
</script>
</body>
</html>
