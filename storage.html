<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FDFAF4; --card:#FFFFFF; --card2:#F4EFE5; --line:#EAE1D1; --text:#221C14; --muted:#6E6454; --accent:#F26B21; --radius:16px; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.5 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:max(16px,env(safe-area-inset-top)) 18px 50px}
  .wrap{max-width:1000px;margin:0 auto}
  header{margin:6px 2px 16px}
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
  header p{color:var(--muted);margin:2px 0 0;font-size:13.5px}
  .drop{display:block;width:100%;border:2px dashed var(--line);border-radius:var(--radius);background:var(--card);padding:26px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:18px}
  .drop:hover,.drop.over{border-color:var(--accent);background:#FFF7F0}
  .drop b{color:var(--accent)}
  .drop .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
  .count{color:var(--muted);font-size:13px;margin:0 2px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(34,28,20,.05);display:flex;flex-direction:column}
  .cell img{width:100%;height:150px;object-fit:cover;background:var(--card2)}
  .cell .body{padding:9px 10px 11px}
  .cell .fn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stamps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:20px}
  .stamp{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:#e6f6ec;color:#1a8f4a;text-transform:capitalize}
  .stamp.none{background:var(--card2);color:var(--muted);font-weight:600}
  .cell .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .del{border:0;background:transparent;color:#c0392b;font:inherit;font-size:12px;cursor:pointer;padding:2px 4px}
  .del:hover{text-decoration:underline}
  .empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);text-align:center;padding:40px 20px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0e1620;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Storage</h1>
    <p>Upload your images here. Your agents pick them up and post them — each image is stamped with the platforms that posted it.</p>
  </header>
  <label class="drop" id="drop">
    <div><b>Click to upload</b> or drag &amp; drop images</div>
    <div class="sub">PNG / JPG / WebP · up to 15MB each · select many at once</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </label>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"><div class="empty">Loading…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PLATFORMS=['facebook','threads','tiktok','instagram'];
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function post(url,body){const h={'Content-Type':'application/json'};try{const t=(window.parent&&window.parent.hermesCsrfToken)||'';if(t)h['X-Hermes-CSRF-Token']=t;}catch(e){}return fetch(url,{method:'POST',credentials:'same-origin',headers:h,body:JSON.stringify(body||{})});}

async function load(){
  try{
    const r=await fetch('/api/storage/list',{credentials:'same-origin'});
    const d=await r.json();
    if(!r.ok||d.error) throw new Error(d.error||('HTTP '+r.status));
    if(d.platforms) PLATFORMS=d.platforms;
    render(d.media||[]);
  }catch(e){ $('#grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
function render(media){
  $('#count').textContent = media.length? (media.length+' image'+(media.length>1?'s':'')) : '';
  if(!media.length){ $('#grid').innerHTML='<div class="empty">No images yet. Upload some — your agents will start posting them.</div>'; return; }
  $('#grid').innerHTML = media.map(m=>{
    const posted=Array.isArray(m.posted)?m.posted:[];
    const done=new Set(posted.map(p=>String(p.platform||'').toLowerCase()));
    const stamps = PLATFORMS.map(p=> done.has(p)
      ? `<span class="stamp" title="by ${esc((posted.find(x=>x.platform===p)||{}).agent||'agent')}">✓ ${esc(p)}</span>`
      : `<span class="stamp none">${esc(p)}</span>`).join('');
    return `<div class="cell">
      <img src="${esc(m.url)}" alt="" loading="lazy">
      <div class="body">
        <div class="fn">${esc(m.filename||'image')}</div>
        <div class="stamps">${stamps}</div>
        <div class="row"><span></span><button class="del" onclick="del(${m.id})">Delete</button></div>
      </div></div>`;
  }).join('');
}
async function del(id){
  if(!confirm('Delete this image?')) return;
  const r=await post('/api/storage/delete',{id});
  if(r.ok){ toast('Deleted'); load(); } else { toast('Delete failed'); }
}

function readAsDataURL(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); }); }
async function upload(files){
  const imgs=[...files].filter(f=>/^image\//.test(f.type));
  if(!imgs.length) return;
  toast('Uploading '+imgs.length+'…');
  let ok=0;
  for(const f of imgs){
    try{
      const dataUrl=await readAsDataURL(f);
      const r=await post('/api/storage/upload',{filename:f.name,dataUrl});
      const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||'HTTP '+r.status);
      ok++;
    }catch(e){ toast('Failed: '+f.name+' — '+e.message); }
  }
  toast('Uploaded '+ok+'/'+imgs.length); load();
}

$('#file').addEventListener('change',e=>{ upload(e.target.files); e.target.value=''; });
const drop=$('#drop');
;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
;['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files) upload(e.dataTransfer.files); });
load();
</script>
</body>
</html>
