<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Connections</title>
<style>
  :root{
    --bg:#0b0f14; --card:#151b23; --card2:#1b232d; --line:#26313d;
    --text:#e7edf3; --muted:#8a97a6; --green:#22c55e; --green-dim:#16351f; --red:#ef4444;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:max(16px,env(safe-area-inset-top)) 16px 40px;
  }
  .wrap{max-width:640px;margin:0 auto}
  header{margin:8px 2px 22px}
  h1{font-size:22px;font-weight:700;margin:0 0 4px}
  header p{color:var(--muted);margin:0;font-size:14px}
  .list{display:flex;flex-direction:column;gap:12px}
  .row{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;transition:border-color .2s,background .2s;
  }
  .row.connected{border-color:var(--green);background:linear-gradient(0deg,var(--green-dim),var(--card))}
  .logo{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;background:var(--card2)}
  .logo svg{width:26px;height:26px}
  .meta{flex:1;min-width:0}
  .name{font-weight:600;font-size:16px}
  .status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:#3a4653}
  .row.connected .dot{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .row.connected .status{color:var(--green)}
  button{
    font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;
    padding:10px 18px;color:#04140a;background:var(--green);transition:filter .15s,opacity .15s;white-space:nowrap;
  }
  button:hover{filter:brightness(1.06)} button:active{transform:translateY(1px)}
  button:disabled{opacity:.6;cursor:default}
  button.disconnect{background:transparent;color:var(--red);border:1px solid #46262a}
  button.disconnect:hover{background:#2a1618}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0e1620;border:1px solid var(--line);
    color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
  .toast.show{opacity:1}
  .note{margin:22px 2px 0;color:var(--muted);font-size:12.5px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Social Connections</h1>
    <p>Connect your accounts to publish posts through the platform APIs.</p>
  </header>
  <div class="list" id="list"></div>
  <p class="note" id="note"></p>
</div>
<div class="toast" id="toast"></div>

<script>
// Order + brand marks as requested: Facebook, Threads, TikTok, Instagram.
const PLATFORMS = [
  { id:"facebook",  name:"Facebook",  color:"#1877F2",
    svg:'<svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>' },
  { id:"threads",   name:"Threads",   color:"#e7edf3",
    svg:'<svg viewBox="0 0 24 24" fill="#e7edf3"><path d="M17.3 11.1c-.1 0-.2-.1-.3-.1-.2-3.2-1.9-5-4.8-5-1.7 0-3.2.8-4 2.1l1.6 1.1c.6-.9 1.5-1.1 2.4-1.1 1.6 0 2.5.9 2.7 2.6-.6-.1-1.3-.2-2-.2-2.6 0-4.4 1.4-4.3 3.5.1 1.9 1.7 3 3.5 3 2.3 0 3.6-1.3 4.1-3 .6.5.9 1.4.9 2.4 0 1.6-.9 3.9-4.9 3.9-3.4 0-5.9-2.4-5.9-6.7S8.6 5.3 12 5.3c2.5 0 4.6 1.1 5.6 3.4l1.9-.6C18.2 4.9 15.4 3.3 12 3.3 7.3 3.3 3.9 6.7 3.9 12S7.3 20.7 12 20.7c4.8 0 6.9-2.8 6.9-5.9 0-2-1-3.4-1.6-3.7zm-4.9 4.9c-.9 0-1.6-.5-1.6-1.2 0-.8.8-1.3 2.1-1.3.6 0 1.2.1 1.7.2-.2 1.4-1 2.3-2.2 2.3z"/></svg>' },
  { id:"tiktok",    name:"TikTok",    color:"#e7edf3",
    svg:'<svg viewBox="0 0 24 24" fill="#e7edf3"><path d="M16.6 5.8a4.3 4.3 0 0 1-1-2.8h-3.3v13c0 1.2-1 2.2-2.2 2.2a2.2 2.2 0 0 1-.6-4.3v-3.4a5.5 5.5 0 1 0 6.1 5.5V8.3a7.4 7.4 0 0 0 4.3 1.4V6.4a4.3 4.3 0 0 1-3.3-.6z"/></svg>' },
  { id:"instagram", name:"Instagram", color:"#E1306C",
    svg:'<svg viewBox="0 0 24 24" fill="#E1306C"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 3.2A6.6 6.6 0 1 0 18.6 12 6.6 6.6 0 0 0 12 5.4zm0 10.9A4.3 4.3 0 1 1 16.3 12 4.3 4.3 0 0 1 12 16.3zm6.8-11.2a1.5 1.5 0 1 0 1.5 1.5 1.5 1.5 0 0 0-1.5-1.5z"/></svg>' },
];

const $ = s => document.querySelector(s);
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3000); }

function render(connected){
  const list=$("#list"); list.innerHTML="";
  PLATFORMS.forEach(p=>{
    const on = !!connected[p.id];
    const row=document.createElement("div");
    row.className="row"+(on?" connected":"");
    row.innerHTML=`
      <div class="logo">${p.svg}</div>
      <div class="meta">
        <div class="name">${p.name}</div>
        <div class="status"><span class="dot"></span>${on?"Connected":"Not connected"}</div>
      </div>`;
    const btn=document.createElement("button");
    if(on){ btn.className="disconnect"; btn.textContent="Disconnect"; btn.onclick=()=>disconnect(p); }
    else  { btn.textContent="Connect"; btn.onclick=()=>connect(p); }
    row.appendChild(btn);
    list.appendChild(row);
  });
}

async function loadStatus(){
  try{
    const r=await fetch("/api/social/status",{credentials:"same-origin"});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    render(d.connected||{});
    $("#note").textContent="Publish to any connected account from the Chat by asking the agent to post.";
  }catch(e){
    render({});
    $("#note").textContent="⚠ Backend not wired yet — this is the connections screen; Connect/Disconnect activate once the Zernio backend deploys.";
  }
}

async function connect(p){
  toast("Opening "+p.name+" authorization…");
  try{
    const r=await fetch("/api/social/connect",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({platform:p.id})});
    const d=await r.json();
    if(d.authUrl){ window.open(d.authUrl,"_blank","noopener"); pollAfterConnect(); }
    else toast(d.error||"Could not start connection.");
  }catch(e){ toast("Connect failed — is the backend deployed?"); }
}

async function disconnect(p){
  if(!confirm("Disconnect "+p.name+"?")) return;
  try{
    const r=await fetch("/api/social/disconnect",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({platform:p.id})});
    if(!r.ok) throw new Error(r.status);
    toast(p.name+" disconnected."); loadStatus();
  }catch(e){ toast("Disconnect failed."); }
}

// After opening the OAuth window, re-check status a few times so the row flips to green automatically.
function pollAfterConnect(){
  let n=0; const iv=setInterval(async()=>{ n++; await loadStatus(); if(n>=12) clearInterval(iv); },5000);
}

loadStatus();
</script>
</body>
</html>
